    "yfinance (==0.2.40)",
    "tqdm (==4.66.4)",
    "torch (==2.3.1)",
    "bs4 (==0.0.2)",
    "colorlog (==6.9.0)",
    "pytest (==8.3.5)",
    "coverage (==7.8.0)",
    "ensure (==1.0.4)",
    "gnews (==0.4.0)",
    "jupyter (==1.1.1)",
    "mlflow (==2.21.0)",
    "ruff (==0.9.10)",
    "seaborn (==0.13.2)",
    "swifter (==1.4.0)",
    "flask (==3.0.3)",
    "gensim (==4.3.2)",
    "matplotlib (==3.9.0)",
    "mypy (==1.15.0)",
    "nltk (==3.8.1)",
    "regex (==2024.5.15)",
    "scikit-learn (==1.5.0)",
    "huggingface-hub (==0.29.1)",
    "pytest-cov (==6.0.0)",
    "python-box (==7.3.2)",
    "python-dateutil (==2.8.2)",
    "python-json-logger (==2.0.7)",
    "pytorch-lightning (==2.2.5)",
    "statsmodels (==0.14.2)",
    "transformers (==4.49.0)",
    "pyyaml (==6.0.1)",
    "selenium (==4.23.1)",
    "tabulate (==0.9.0)",
    "umap (==0.1.1)",
    "tensorflow-io-gcs-filesystem (==0.31.0)",
    "tensorflow (>=2.19.0,<3.0.0)"
