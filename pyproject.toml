[project]
name = "eth-price-predition"
version = "0.1.0"
description = "Ethereum price prediction using hybrid deep learning algorithms"
authors = [
    {name = "rdhakan13",email = "rdhakaan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tensorflow-io-gcs-filesystem (==0.31.0)",
    "tensorflow (==2.18.0)",
    "transformers (>=4.51.3,<5.0.0)",
    "huggingface-hub (>=0.30.2,<0.31.0)",
    "torch (==2.3.1)",
    "tqdm (==4.66.4)",
    "colorlog (==6.9.0)",
    "pytest (==8.3.5)",
    "jupyter (==1.1.1)",
    "scikit-learn (==1.6.1)",
    "pandas (>=2.2.3,<3.0.0)",
    "swifter (==1.4.0)",
    "gensim (==4.3.3)",
    "yfinance (>=0.2.59,<0.3.0)",
    "pytest-cov (==6.0.0)",
    "fastcore (==1.7.1)",
    "fastprogress (==1.0.3)",
    "pyyaml (==6.0.2)",
    "tabulate (==0.9.0)",
    "statsmodels (==0.14.2)",
    "python-box (==7.3.2)",
    "mypy (==1.15.0)",
    "ruff (==0.9.10)",
    "gnews (==0.4.0)",
    "bs4 (==0.0.2)",
    "mlflow (==2.21.0)",
    "pybind11 (>=2.13.6,<3.0.0)",
    "ensure (>=1.0.4,<2.0.0)",
    "coverage (==7.8.0)",
    "arch (==7.2.0)",
    "nltk (==3.8.1)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pmdarima (>=2.0.4,<3.0.0)",
    "darts (==0.35.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = false 

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nltk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "swifter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tabulate.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tqdm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gnews.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "seaborn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "statsmodels.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ensure.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastprogress.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pmdarima.*"
ignore_missing_imports = true