[project]
name = "eth-price-predition"
version = "0.1.0"
description = "Ethereum price prediction using hybrid deep learning algorithms"
authors = [
    {name = "rdhakan13",email = "rdhakaan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tensorflow-io-gcs-filesystem (==0.31.0)",
    "tensorflow (==2.18.0)",
    "transformers (>=4.51.3,<5.0.0)",
    "huggingface-hub (>=0.30.2,<0.31.0)",
    "torch (==2.3.1)",
    "tqdm (==4.66.4)",
    "colorlog (==6.9.0)",
    "pytest (==8.3.5)",
    "jupyter (==1.1.1)",
    "scikit-learn (==1.5.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "swifter (==1.4.0)",
    "gensim (==4.3.2)",
    "yfinance (==0.2.55)",
    "pytest-cov (==6.0.0)",
    "fastcore (==1.7.1)",
    "fastprogress (==1.0.3)",
    "pyyaml (==6.0.2)",
    "tabulate (==0.9.0)",
    "statsmodels (==0.14.2)",
    "python-box (==7.3.2)",
    "mypy (==1.15.0)",
    "ruff (==0.9.10)",
    "gnews (==0.4.0)",
    "bs4 (==0.0.2)",
    "mlflow (==2.21.0)",
    "pybind11 (>=2.13.6,<3.0.0)",
    "ensure (>=1.0.4,<2.0.0)",
    "coverage (==7.8.0)",
    "arch (==7.2.0)",
    "nltk (==3.8.1)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
