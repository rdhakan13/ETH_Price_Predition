name: Run Pytest Unit Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniconda-version: "latest"

      - name: Create Conda Environment using Makefile
        run: |
          make create-env  # Assumes that the Makefile has a 'create-env' target for environment setup

      - name: Activate Conda Environment
        run: |
          source activate ETH_CUDA  # Activate the environment named 'ETH_CUDA'

      - name: Run pytest with coverage
        run: |
          pytest --maxfail=1 --disable-warnings -q --cov=my_project --cov-report=term  # Replace `my_project` with the module you want to check coverage for

      - name: Check coverage threshold (>=80%)
        run: |
          COVERAGE=$(pytest --maxfail=1 --disable-warnings -q --cov=my_project --cov-report=term-missing | tail -n 10 | grep -oP '(?<=TOTAL\s+)\d+(\.\d+)?(?=%)')
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Code coverage is below 80%. Coverage is ${COVERAGE}%"
            exit 1  # Fail the job if coverage is below 80%
          else
            echo "Code coverage is ${COVERAGE}%, which is above the threshold."
          fi
